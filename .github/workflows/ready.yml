name: Ready issue

on:
  issues:
    types: [labeled]

# Single allowed-user rule: only the repository owner may add the "ready" label.
# `env` is not available in job-level `if`, so both jobs compare
# github.event.sender.login with github.repository_owner directly. That is the
# owner here and stays correct when the repo is created from the template.
# For an organisation-owned repo github.repository_owner is the org name, which no
# sender login equals, so the guard would strip every "ready" label and the
# conductor would never run; in that case replace github.repository_owner in both
# `if` expressions with the allowed login (or a vars. entry via a job-level check)
# before using the template.

jobs:
  # Removes "ready" when anyone but the owner adds it. Plain shell, no Claude.
  # Own concurrency group (per issue) so it never waits behind a long conductor run.
  guard:
    if: github.event.label.name == 'ready' && github.event.sender.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: ready-guard-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
      SENDER: ${{ github.event.sender.login }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          if gh api -X DELETE "repos/$REPO/issues/$ISSUE/labels/ready"; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "Removed the \`ready\` label: it was added by @$SENDER, but only the repository owner (@$OWNER) may add it. To start the work, the owner adds the \`ready\` label."
          else
            gh issue comment "$ISSUE" --repo "$REPO" --body "The \`ready\` label was added by @$SENDER, who is not the repository owner (@$OWNER), but it could not be removed automatically. @$OWNER please check this issue."
            exit 1
          fi

  # One conductor at a time. Each run drains the whole "ready" backlog, so a
  # queued run that GitHub drops (it keeps only the newest pending one) loses
  # nothing. Job-level so the guard job is never queued behind it.
  conductor:
    if: github.event.label.name == 'ready' && github.event.sender.login == github.repository_owner
    concurrency:
      group: ready-queue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription token from `claude setup-token`.
          # Alternative: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Repository: ${{ github.repository }}. Work through the "ready" backlog.
            1. List open issues labeled "ready" (gh issue list --label ready), oldest
               first, skipping any that already have an open PR (check gh pr list for
               "Closes #<n>" or the issue's branch) or the needs-decision label.
            2. Take the first one and follow the conductor flow from CLAUDE.md:
               builder -> reviewer (max 2 rounds) -> docs -> open PR. If a branch for
               it already exists, resume from it instead of starting over.
            3. Then re-list and take the next one. Repeat until none remain or you
               run out of turns. One issue at a time, never in parallel.
            This run is unattended: do not wait for answers. If an issue needs the
            owner's input, comment the question, add the needs-decision label, skip
            that issue and continue with the next. Exception: if the working tree
            is dirty when you start an issue, comment what is dirty on that issue,
            add the needs-decision label and stop the run (the next issue could
            not start either). Before stopping, update
            docs/progress.md with where you left off. Never merge, never push to
            main, never add the "ready" label.
          # Best-effort hard block on `gh` command strings, independent of
          # .claude/settings.json: unattended runs should not be able to add the
          # "ready" label (only the owner does that). Not an absolute guarantee:
          # other tools or obfuscated commands could still reach the API.
          # As far as we could tell from the Action's source, it registers the
          # official GitHub MCP server (which can set labels via update_issue/
          # create_issue, or issue_write in newer server versions) only when
          # allowedTools names it; this workflow does not. The server-level deny
          # "mcp__github" below is defense in depth: it denies every tool of that
          # server, which the unattended flow does not use.
          # The *ready* substring also refuses unrelated commands containing the
          # word (e.g. a title with "already"); this fails closed, by design.
          claude_args: |
            --agent conductor
            --max-turns 200
            --disallowedTools "Bash(gh issue edit *ready*)" "Bash(gh issue create *ready*)" "Bash(gh api *)" "Bash(gh * issue edit *ready*)" "Bash(gh * issue create *ready*)" "Bash(gh pr edit *)" "mcp__github"
